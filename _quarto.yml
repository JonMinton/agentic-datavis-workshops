project:
  type: website
  output-dir: docs
  # Only these files are published. Without this list, a full render also turns every
  # .md file (session notes, guides, README, LICENSE) into a public page.
  render:
    - index.qmd
    - example-gg-spec.qmd
    - mapping-builder.qmd
    - slides/*.qmd
    - sessions/*/office-data*.qmd

website:
  title: "Agentic data-vis workshops"
  description: "Occasional workshops on data visualisation with an agentic AI assistant: the grammar of graphics, one TidyTuesday dataset at a time"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: example-gg-spec.qmd
        text: How a spec works
      - href: mapping-builder.qmd
        text: Mapping builder
      - href: slides/2026-09-29-vishub.qmd
        text: Slides
    right:
      - icon: github
        href: https://github.com/JonMinton/agentic-datavis-workshops

format:
  html:
    theme: flatly
    toc: true
    code-fold: true
    code-tools: true
    fig-width: 9
    fig-height: 6
    fig-dpi: 150
    df-print: kable

execute:
  warning: false
  message: false
  freeze: auto
