# Spec 01. Room decision: longitude on x, latitude on y, plant category on colour and
# shape. The point geom is implied by shape (only points carry a shape). Every other
# slot is left at the ggplot2 default.
data: tt-2023-04-18-founder_crops   # grain: one row per taxon in one phase of one site
mapping:
  x: longitude
  y: latitude
  colour: category
  shape: category
layers:
  - geom: point
